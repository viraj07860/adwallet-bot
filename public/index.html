<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AdWallet – Earn While You Watch</title>

  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* ... (Keeping your exact CSS from above as it looks perfect) ... */
    :root {
      --green: #22c55e;
      --green-dark: #16a34a;
      --green-light: #bbf7d0;
      --green-glow: rgba(34,197,94,.35);
      --white: #ffffff;
      --bg: #f0fdf4;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 24px rgba(0,0,0,.08);
      --radius: 18px;
      --nav-h: 68px;
      --sidebar-w: 280px;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;overflow:hidden;}
    body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);position:relative;overflow:hidden;}
    #overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:900;backdrop-filter:blur(3px);}
    #overlay.show{opacity:1;pointer-events:all;}
    #sidebar{position:fixed;top:0;left:0;height:100%;width:var(--sidebar-w);background:var(--white);border-radius:0 28px 28px 0;box-shadow:8px 0 40px rgba(0,0,0,.18);transform:translateX(-100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:1000;display:flex;flex-direction:column;overflow:hidden;}
    #sidebar.open{transform:translateX(0);}
    .sb-header{background:linear-gradient(135deg,var(--green-dark),var(--green));padding:36px 24px 24px;color:#fff;}
    .sb-avatar{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:10px;border:2px solid rgba(255,255,255,.5);}
    .sb-name{font-size:17px;font-weight:700;}
    .sb-bal{font-size:13px;opacity:.85;margin-top:3px;}
    .sb-nav{flex:1;padding:16px 12px;overflow-y:auto;}
    .sb-item{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:14px;cursor:pointer;transition:all .2s;margin-bottom:4px;font-size:15px;font-weight:500;color:var(--text);}
    .sb-item:hover{background:var(--green-light);}
    .sb-item.active{background:var(--green);color:#fff;box-shadow:0 4px 16px var(--green-glow);}
    .sb-item .icon{font-size:20px;min-width:26px;text-align:center;}
    .sb-footer{padding:16px 20px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);text-align:center;}
    #topbar{position:fixed;top:0;left:0;right:0;height:60px;background:var(--white);display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:0 2px 12px rgba(0,0,0,.06);z-index:800;}
    .tb-left{display:flex;align-items:center;gap:12px;}
    .hamburger{width:40px;height:40px;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:background .2s;}
    .hamburger:hover{background:var(--green-light);}
    .hamburger span{display:block;width:20px;height:2.5px;background:var(--text);border-radius:4px;transition:all .3s;}
    .logo{font-size:20px;font-weight:800;color:var(--green-dark);}
    .logo span{color:var(--green);}
    .tb-right{display:flex;align-items:center;gap:8px;}
    .tb-badge{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:700;}
    .tb-notif{width:38px;height:38px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;position:relative;}
    .notif-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;background:#ef4444;border-radius:50%;border:2px solid #fff;}
    #main{position:fixed;top:60px;bottom:var(--nav-h);left:0;right:0;overflow-y:auto;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;}
    .page{display:none;padding:16px 16px 24px;}
    .page.active{display:block;}
    .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;border:1px solid var(--border);}
    .balance-card{background:linear-gradient(135deg,#16a34a 0%,#22c55e 60%,#4ade80 100%);color:#fff;border-radius:24px;padding:26px 22px;box-shadow:0 8px 32px var(--green-glow);position:relative;overflow:hidden;margin-bottom:16px;}
    .bal-greeting{font-size:14px;opacity:.9;margin-bottom:4px;}
    .bal-amount{font-size:42px;font-weight:900;letter-spacing:-1px;line-height:1;}
    .bal-label{font-size:13px;opacity:.8;margin-top:4px;}
    .progress-wrap{margin-top:18px;}
    .progress-label{display:flex;justify-content:space-between;font-size:12px;opacity:.85;margin-bottom:6px;}
    .progress-bar{height:8px;background:rgba(255,255,255,.25);border-radius:8px;overflow:hidden;}
    .progress-fill{height:100%;width:0%;background:#fff;border-radius:8px;box-shadow:0 0 10px rgba(255,255,255,.6);transition:width 1s ease;}
    .bal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;}
    .btn{padding:13px 16px;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;border:none;outline:none;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:7px;text-align:center;}
    .btn:active{transform:scale(.95);}
    .btn-white{background:#fff;color:var(--green-dark);}
    .btn-outline{background:rgba(255,255,255,.2);color:#fff;border:1.5px solid rgba(255,255,255,.5);}
    .btn-green{background:var(--green);color:#fff;box-shadow:0 4px 14px var(--green-glow);}
    .btn-ghost{background:var(--bg);color:var(--text);border:1.5px solid var(--border);}
    .earn-pills{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
    .pill{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;}
    .pill-icon{font-size:26px;}
    .pill-val{font-size:16px;font-weight:800;color:var(--green-dark);}
    .pill-desc{font-size:12px;color:var(--muted);}
    .ref-link-wrap{display:flex;align-items:center;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin:12px 0;}
    .ref-link-wrap input{flex:1;padding:12px;background:transparent;border:none;outline:none;font-size:13px;color:var(--text);}
    .copy-btn{padding:12px 14px;background:var(--green);color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:background .2s;white-space:nowrap;border:none;}
    .share-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
    .share-btn{flex:1;min-width:70px;padding:10px 8px;border-radius:12px;font-size:12px;font-weight:600;cursor:pointer;border:none;color:#fff;display:flex;align-items:center;justify-content:center;gap:5px;}
    .sh-tg{background:#0088cc;} .sh-wa{background:#25d366;} .sh-tw{background:#1da1f2;} .sh-fb{background:#1877f2;} .sh-me{background:#0084ff;}
    .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .stat-item{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1px solid #bbf7d0;border-radius:14px;padding:16px;text-align:center;}
    .stat-num{font-size:20px;font-weight:800;color:var(--green-dark);}
    .stat-lbl{font-size:11px;color:var(--muted);margin-top:3px;}
    .live-dot{display:inline-block;width:7px;height:7px;background:#22c55e;border-radius:50%;margin-right:5px;animation:pulse 1.4s ease-in-out infinite;}
    .ads-grid{display:flex;flex-direction:column;gap:12px;}
    .ad-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);}
    .ad-thumb{width:60px;height:60px;border-radius:12px;background:linear-gradient(135deg,#e0f2fe,#bae6fd);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
    .ad-info{flex:1;}
    .ad-title{font-size:14px;font-weight:700;}
    .ad-reward{font-size:13px;color:var(--green-dark);font-weight:600;margin-top:3px;}
    .ad-dur{font-size:11px;color:var(--muted);margin-top:2px;}
    .ad-btn{padding:9px 18px;font-size:13px;}
    .method-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
    .method{background:var(--bg);border:2px solid var(--border);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;transition:all .2s;}
    .method.sel{border-color:var(--green);background:var(--green-light);box-shadow:0 0 0 3px var(--green-glow);}
    .method-fields{display:none;margin-top:12px;}
    .method-fields.active{display:block;}
    .field{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--border);font-size:15px;outline:none;background:var(--bg);color:var(--text);margin-top:10px;}
    .field:focus{border-color:var(--green);}
    .amount-input{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--border);font-size:18px;font-weight:700;outline:none;background:var(--bg);color:var(--text);margin-bottom:8px;}
    .min-note{font-size:12px;color:var(--muted);margin-bottom:16px;}
    .min-note span{color:var(--green-dark);font-weight:700;}
    .faq-item{border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;}
    .faq-q{padding:16px;font-size:14px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--card);}
    .faq-a{max-height:0;overflow:hidden;transition:max-height .35s ease,padding .35s;background:#f8fff9;font-size:13px;color:var(--muted);line-height:1.6;padding:0 16px;}
    .faq-item.open .faq-a{max-height:220px;padding:14px 16px;}
    #bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--white);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;z-index:800;box-shadow:0 -4px 20px rgba(0,0,0,.07);}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px 12px;border-radius:12px;transition:all .2s;flex:1;}
    .nav-item.active .nav-lbl{color:var(--green);}
    #fab{position:fixed;bottom:calc(var(--nav-h) + 16px);right:18px;width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px var(--green-glow);cursor:pointer;z-index:700;border:none;}
    .popup{position:fixed;top:72px;left:16px;right:16px;z-index:1100;background:var(--white);border-left:4px solid var(--green);border-radius:14px;padding:12px 16px;margin-bottom:8px;box-shadow:0 8px 32px rgba(0,0,0,.15);display:flex;align-items:center;gap:12px;transform:translateY(-20px) scale(.95);opacity:0;transition:all .4s;pointer-events:all;}
    .popup.show{transform:translateY(0) scale(1);opacity:1;}
    #toast{position:fixed;bottom:calc(var(--nav-h) + 80px);left:50%;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:2000;pointer-events:none;white-space:nowrap;}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.6);opacity:.6;}}
  </style>
</head>
<body>

<div id="overlay" onclick="toggleSidebar()"></div>

<nav id="sidebar">
  <div class="sb-header">
    <div class="sb-avatar">👤</div>
    <div class="sb-name" id="sb-name">User</div>
    <div class="sb-bal">Balance: <strong id="sb-bal">$0.00</strong></div>
  </div>
  <div class="sb-nav">
    <div class="sb-item active" onclick="navigate('dashboard',0,this)"><span class="icon">🏠</span> Dashboard</div>
    <div class="sb-item" onclick="navigate('ads',1,this)"><span class="icon">▶️</span> Watch Ads</div>
    <div class="sb-item" onclick="navigate('offers',2,this)"><span class="icon">🎁</span> Offer Center</div>
    <div class="sb-item" onclick="navigate('invite',3,this)"><span class="icon">👥</span> Invite Friends</div>
    <div class="sb-item" onclick="navigate('cashout',4,this)"><span class="icon">💸</span> Cash Out</div>
    <div class="sb-item" onclick="navigate('vip',5,this)"><span class="icon">💎</span> VIP</div>
    <div class="sb-item" onclick="navigate('help',6,this)"><span class="icon">❓</span> Help &amp; FAQ</div>
  </div>
  <div class="sb-footer">AdWallet · Made with 💚</div>
</nav>

<header id="topbar">
  <div class="tb-left">
    <div class="hamburger" onclick="toggleSidebar()" id="ham">
      <span></span><span></span><span></span>
    </div>
    <div class="logo">Ad<span>Wallet</span></div>
  </div>
  <div class="tb-right">
    <div class="tb-badge">💰 $<span id="tb-bal">0.00</span></div>
    <div class="tb-notif">🔔<span class="notif-dot"></span></div>
  </div>
</header>

<div id="popup-container"></div>

<main id="main">
  </main>

<nav id="bottom-nav">
  <div class="nav-item active" onclick="navigate('dashboard',0)" id="nav-0"><span class="nav-icon">🏠</span><span class="nav-lbl">Home</span></div>
  <div class="nav-item" onclick="navigate('ads',1)" id="nav-1"><span class="nav-icon">▶️</span><span class="nav-lbl">Earn</span></div>
  <div class="nav-item" onclick="navigate('offers',2)" id="nav-2"><span class="nav-icon">🎁</span><span class="nav-lbl">Offers</span></div>
  <div class="nav-item" onclick="navigate('invite',3)" id="nav-3"><span class="nav-icon">👥</span><span class="nav-lbl">Invite</span></div>
  <div class="nav-item" onclick="navigate('cashout',4)" id="nav-4"><span class="nav-icon">💸</span><span class="nav-lbl">Cash</span></div>
  <div class="nav-item" onclick="navigate('vip',5)" id="nav-5"><span class="nav-icon">💎</span><span class="nav-lbl">VIP</span></div>
</nav>

<button id="fab" onclick="navigate('ads',1)" title="Earn Now">⚡</button>
<div id="toast"></div>

<script>
let balance = 0;
let userId = '';
let adInstance = null;

// Fix 1: Robust User ID fetching
function getTelegramUserId() {
  const urlParams = new URLSearchParams(window.location.search);
  const urlId = urlParams.get('id');
  if (urlId) return String(urlId);
  
  const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
  if (tgUser?.id) return String(tgUser.id);
  
  return '';
}

// Fix 2: Real-time Data Sync with MongoDB
async function loadUser() {
  if (!userId) return;
  try {
    const res = await fetch(`/user/${userId}`);
    const data = await res.json();
    
    balance = data.balance || 0;
    
    // Update all UI elements
    const fmt = balance.toFixed(2);
    document.getElementById('bal-main').textContent = fmt;
    document.getElementById('tb-bal').textContent = fmt;
    document.getElementById('sb-bal').textContent = '$' + fmt;
    document.getElementById('co-bal').textContent = '$' + fmt;
    document.getElementById('ref-count').textContent = data.referralCount || 0;
    document.getElementById('ref-earnings').textContent = (data.referralEarnings || 0).toFixed(2);
    
    const name = window.Telegram?.WebApp?.initDataUnsafe?.user?.first_name || data.username || 'User';
    document.getElementById('bal-greeting').textContent = `👋 Hi, ${name}!`;
    document.getElementById('sb-name').textContent = name;
    
    const vipStatus = document.getElementById('vip-status-text');
    if (vipStatus) {
      vipStatus.textContent = data.vip ? `Active: ${data.vipPlan}` : 'Not activated yet';
    }

    const pct = Math.min(100, (balance / 100) * 100);
    document.getElementById('prog-fill').style.width = pct + '%';
    document.getElementById('progress-text').textContent = `$${fmt} / $100.00`;
  } catch (e) {
    console.error('Failed to load user data');
  }
}

// Fix 3: Rewards with persistence
async function watchAd(btn) {
  try {
    if (btn) { btn.disabled = true; btn.textContent = '⏳'; }

    // Show the actual ad
    await showRewardedAd();

    // Notify backend to save reward to MongoDB
    const res = await fetch(`/api/reward?userid=${userId}&key=adwallet7062`);
    const text = await res.text();

    if (text === 'OK') {
      showToast('🎬 Reward added to balance!');
      await loadUser(); // Refresh UI from DB
    } else {
      showToast(text === 'TOO_FAST' ? '⏳ Wait 5s between ads' : '❌ Reward failed');
    }
  } catch (e) {
    showToast('❌ Ad failed to load');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Watch'; }
  }
}

// Fix 4: VIP Purchase logic (Sends userId correctly)
async function buyVipStars(plan) {
  if (!userId) { showToast('Please open from Bot'); return; }
  try {
    const res = await fetch(`/api/vip-invoice?plan=${plan}&userId=${userId}`);
    const data = await res.json();

    if (data.ok && window.Telegram?.WebApp?.openInvoice) {
      window.Telegram.WebApp.openInvoice(data.invoiceUrl, async (status) => {
        if (status === 'paid') {
          showToast('💎 VIP Upgrade Successful!');
          await loadUser();
        }
      });
    }
  } catch (e) {
    showToast('❌ Invoice error');
  }
}

// Helper: Setup Referral Link
function setReferralLink() {
  const input = document.getElementById('ref-link-input');
  if (userId) {
    input.value = `https://t.me/AdzwalletBot?start=${userId}`;
  }
}

// ... Rest of your UI logic (navigate, toggleSidebar, toast, etc.)
function navigate(page, idx, sbItem) {
  if(sidebarOpen) toggleSidebar();
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach((n,i)=> n.classList.toggle('active', i === idx));
  if(navigator.vibrate) navigator.vibrate(20);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function copyRef() {
  const val = document.getElementById('ref-link-input').value;
  navigator.clipboard.writeText(val).then(()=>showToast('📋 Copied!'));
}

// Initialize
(function init() {
  userId = getTelegramUserId();
  if (window.Telegram?.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }
  setReferralLink();
  loadUser();
  
  // Basic Adsgram Init
  if (window.Adsgram) {
    adInstance = window.Adsgram.init({ blockId: '26225' });
  }
})();

async function showRewardedAd() {
  if (adInstance) return adInstance.show();
  throw new Error('Ads not ready');
}
</script>
</body>
</html>
