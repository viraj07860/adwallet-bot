<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AdzWallet</title>

<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body { background:#111; color:#fff; font-family:sans-serif; padding:15px; }
.card { background:#1e1e1e; padding:15px; border-radius:10px; margin-bottom:10px; }
.btn { width:100%; padding:10px; background:#00f2ff; border:none; border-radius:5px; margin-top:10px; }
input, select { width:100%; padding:8px; margin-top:5px; }
</style>
</head>

<body>

<h2>💰 AdzWallet</h2>

<div class="card">
Balance: ₹<span id="balance">0</span><br>
Tasks: <span id="tasks">0</span><br>
Referrals: <span id="refCount">0</span>
</div>

<div class="card">
<button class="btn" onclick="runTask()">📺 Watch Ad (+₹20)</button>
</div>

<div class="card">
<h3>👥 Referral</h3>
<input id="refLink" readonly>
<button class="btn" onclick="copyRef()">Copy Link</button>
</div>

<div class="card">
<h3>💸 Withdraw</h3>
<select id="method">
<option>UPI</option>
<option>Paytm</option>
<option>USDT</option>
</select>
<input id="account" placeholder="Enter details">
<button class="btn" onclick="withdraw()">Withdraw</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const params = new URLSearchParams(window.location.search);
const userId = params.get('id');

// Ads init
window.onload = () => {
  if (window.Adsgram) {
    window.Adsgram.init({ blockId: "26225" });
  }
};

async function runTask() {
  try {
    await window.Adsgram.show();
    alert("Ad watched!");
    setTimeout(loadUser, 2000);
  } catch {
    alert("Ad failed");
  }
}

async function loadUser() {
  const res = await fetch(`/user/${userId}`);
  const d = await res.json();

  document.getElementById('balance').innerText = d.balance;
  document.getElementById('tasks').innerText = d.tasks;
  document.getElementById('refCount').innerText = d.referralCount || 0;
}

function loadRef() {
  document.getElementById('refLink').value =
    `https://t.me/AdzwalletBot?start=${userId}`;
}

function copyRef() {
  navigator.clipboard.writeText(document.getElementById('refLink').value);
  alert("Copied!");
}

async function withdraw() {
  const method = document.getElementById('method').value;
  const account = document.getElementById('account').value;

  const res = await fetch('/api/withdraw', {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ userId, method, account })
  });

  const d = await res.json();
  alert(d.success ? "Requested!" : d.message);
}

loadUser();
loadRef();
</script>

</body>
</html>
