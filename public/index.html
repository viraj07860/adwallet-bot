<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AdzWallet</title>

<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin:0;
  font-family: system-ui;
  background:#0c0f14;
  color:#fff;
}

/* HEADER */
.header {
  padding:15px;
  text-align:center;
  font-weight:bold;
  font-size:18px;
}

/* CARD */
.card {
  background:#151a22;
  margin:10px;
  padding:15px;
  border-radius:15px;
}

/* BALANCE */
.balance {
  text-align:center;
  font-size:30px;
  font-weight:bold;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.box {
  background:#1d2430;
  padding:12px;
  border-radius:12px;
  text-align:center;
}

/* BUTTON */
.btn {
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#00f2ff,#4facfe);
  color:#000;
  font-weight:bold;
  margin-top:10px;
}

/* METHOD GRID */
.method-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.method {
  background:#1d2430;
  padding:10px;
  border-radius:10px;
  text-align:center;
  cursor:pointer;
}

.method.sel {
  border:2px solid #00f2ff;
}

/* INPUT */
input {
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  margin-top:10px;
}

/* NAV */
.nav {
  position:fixed;
  bottom:0;
  width:100%;
  background:#111;
  display:flex;
  justify-content:space-around;
  padding:10px;
}

.nav div {
  color:#888;
  cursor:pointer;
}

.nav .active {
  color:#00f2ff;
}

.page { display:none; }
.page.active { display:block; }

</style>
</head>

<body>

<div class="header">💰 AdzWallet</div>

<!-- HOME -->
<div id="home" class="page active">

<div class="card">
  <div class="balance">₹<span id="balance">0</span></div>
</div>

<div class="grid">
  <div class="box">
    <div id="tasks">0</div>
    <small>Tasks</small>
  </div>
  <div class="box">
    <div id="refs">0</div>
    <small>Referrals</small>
  </div>
</div>

</div>

<!-- EARN -->
<div id="earn" class="page">
  <div class="card">
    <button class="btn" onclick="watchAd()">📺 Watch Ad (+₹20)</button>
  </div>
</div>

<!-- REFERRAL -->
<div id="ref" class="page">
  <div class="card">
    <input id="refLink" readonly>
    <button class="btn" onclick="copyRef()">Copy Link</button>
  </div>
</div>

<!-- WITHDRAW -->
<div id="wallet" class="page">

<div class="card">

<div class="method-grid">

<div class="method sel" onclick="selectMethod(this)">PayPal</div>
<div class="method" onclick="selectMethod(this)">Bitcoin</div>
<div class="method" onclick="selectMethod(this)">USDT</div>
<div class="method" onclick="selectMethod(this)">UPI</div>
<div class="method" onclick="selectMethod(this)">Paytm</div>
<div class="method" onclick="selectMethod(this)">Telegram</div>

</div>

<input id="amount" placeholder="Amount">
<input id="account" placeholder="Account / Wallet">

<button class="btn" onclick="withdraw()">Withdraw</button>

</div>

</div>

<!-- NAV -->
<div class="nav">
  <div class="active" onclick="tab('home',this)">Home</div>
  <div onclick="tab('earn',this)">Earn</div>
  <div onclick="tab('ref',this)">Refer</div>
  <div onclick="tab('wallet',this)">Wallet</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const userId = new URLSearchParams(location.search).get('id');

// INIT ADSGRAM
window.onload = () => {
  if(window.Adsgram){
    window.Adsgram.init({ blockId: "26225" });
  }
};

// NAV
function tab(id,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav div').forEach(n=>n.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
}

// SELECT METHOD
function selectMethod(el){
  document.querySelectorAll('.method').forEach(m=>m.classList.remove('sel'));
  el.classList.add('sel');
}

// WATCH AD
async function watchAd(){
  try{
    await window.Adsgram.show();
    alert("Ad watched!");
    setTimeout(loadUser,2000);
  }catch(e){
    alert("Ad failed ❌");
  }
}

// LOAD USER
async function loadUser(){
  const res = await fetch(`/user/${userId}`);
  const d = await res.json();

  balance.innerText = d.balance;
  tasks.innerText = d.tasks;
  refs.innerText = d.referralCount || 0;
}

// REF LINK
refLink.value = `https://t.me/AdzwalletBot?start=${userId}`;

function copyRef(){
  navigator.clipboard.writeText(refLink.value);
  alert("Copied!");
}

// WITHDRAW
async function withdraw(){
  const method = document.querySelector('.method.sel').innerText;
  const amount = document.getElementById('amount').value;
  const account = document.getElementById('account').value;

  const res = await fetch('/api/withdraw',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ userId, method, amount, account })
  });

  const d = await res.json();
  alert(d.success ? "Requested!" : d.message);
}

loadUser();
</script>

</body>
</html>
